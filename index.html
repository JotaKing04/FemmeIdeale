  .celda-cantidad {
    width: 44px;
    height: 40px;
  }
  .grilla-cantidades {
    border-spacing: 3px;
  }
  .grilla-cantidades th {
    padding: 2px 3px;
    font-size: 0.8rem;
  }
}

/* Datos de contacto que se tocan (0.18). */
.enlace-dato {
  color: var(--acento);
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--acento) 35%, transparent);
  text-underline-offset: 3px;
  overflow-wrap: anywhere;
}
.enlace-dato:hover {
  text-decoration-color: currentColor;
}
.datos-contacto {
  display: flex;
  flex-wrap: wrap;
  gap: 2px 12px;
}
.boton-copiar {
  margin-left: 8px;
}

/* ───── Listas 0.18: orden, fecha, encabezados por fecha y «Ver más» ───── */
.barra-orden {
  display: flex;
  flex-wrap: wrap;
  gap: var(--e2);
}
.selector-chico select,
.selector-chico input {
  min-height: 40px;
  padding: 6px 10px;
  border: 1px solid var(--borde);
  border-radius: var(--radio-control);
  background-color: var(--superficie);
  color: var(--tinta);
  font: inherit;
  font-size: 0.9rem;
}
.barra-pedidos {
  align-items: center;
}
@container pantalla (max-width: 680px) {
  .barra-pedidos > input[type='search'] {
    flex: 1 1 100%;
  }
  .barra-orden {
    flex: 1 1 100%;
  }
  .barra-orden .selector-chico {
    flex: 1 1 0;
    min-width: 0;
  }
  .barra-orden select,
  .barra-orden input {
    width: 100%;
  }
}
/* Los estados en un solo renglón que se desliza, en vez de dos o tres renglones de chips. */
.filtros-deslizan {
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent);
  mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent);
}
.filtros-deslizan::-webkit-scrollbar {
  display: none;
}
.filtros-deslizan > .filtros {
  flex-wrap: nowrap;
  padding-right: 28px;
}
.filtros-deslizan .chip {
  flex: none;
  white-space: nowrap;
}
.grupo-lista {
  position: sticky;
  top: 0;
  z-index: 2;
  padding: 10px 16px 6px;
  background: var(--fondo);
  color: var(--tinta-2);
  font-size: 0.8rem;
  font-weight: 650;
}
.ver-mas {
  display: block;
  width: 100%;
  min-height: 48px;
  border: 0;
  background: transparent;
  color: var(--acento);
  font: inherit;
  font-weight: 600;
}
.ver-mas:hover {
  background: var(--relleno);
}

/* ───── 0.19: buscar por DNI y hacer el cambio ───── */
.busqueda-clienta {
  display: flex;
  align-items: center;
  gap: 11px;
  margin: 2px 2px 0;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--relleno);
}
.busqueda-clienta .icono {
  width: 22px;
  height: 22px;
  color: var(--acento);
}
.busqueda-item .crece {
  min-width: 0;
}
.busqueda-item .crece .tenue {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.compra-con-cambio {
  display: flex;
  align-items: stretch;
}
.compra-con-cambio > .renglon {
  flex: 1;
  min-width: 0;
}
.compra-con-cambio > .boton {
  flex: none;
  align-self: center;
  margin-right: 6px;
}
@media (max-width: 700px) {
  .compra-con-cambio {
    flex-direction: column;
  }
  .compra-con-cambio > .boton {
    align-self: flex-start;
    margin: -6px 0 6px 6px;
  }
}

/* ───── 0.22: descuento por prenda en el carrito ───── */
.descuento-prenda {
  flex: none;
}
.descuento-prenda .entrada {
  width: auto;
  min-width: 0;
  height: 36px;
  padding: 0 28px 0 10px;
  font-size: 0.85rem;
}
.carrito .renglon .num .tachado {
  font-weight: 400;
  color: var(--tinta-2);
}

/* ───── Gestión de cambios: lista (0.30) ───── */
.grupo-de-cambios > h3 {
  margin: 0 0 0 4px;
  font-weight: 600;
}
.renglon.fila-cambio {
  padding: 0;
  gap: 10px;
}
.fila-cambio:hover {
  background: var(--relleno);
}
.fila-cambio-abrir {
  display: grid;
  gap: 3px;
  min-width: 0;
  padding: 11px 0 11px 16px;
  background: transparent;
  border: 0;
  text-align: left;
  color: inherit;
  font: inherit;
  cursor: pointer;
}
.fila-cambio-quien {
  overflow-wrap: anywhere;
}
.fila-cambio-prendas {
  display: grid;
  gap: 1px;
  overflow-wrap: anywhere;
}
.fila-cambio-prendas .tenue {
  display: inline-block;
  min-width: 4.6em;
}
.fila-cambio-lado {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  padding-right: 16px;
}
@media (max-width: 640px) {
  .renglon.fila-cambio {
    flex-wrap: wrap;
    gap: 0;
  }
  .fila-cambio-abrir {
    padding-right: 16px;
  }
  .fila-cambio-lado {
    width: 100%;
    justify-content: flex-end;
    padding: 0 16px 12px;
  }
  .fila-cambio-lado:empty {
    display: none;
  }
}
.recibo-retirar .recibo-retirar-firma {
  font-size: 10pt;
  margin-top: 1.5mm;
}
